name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-validation:
    name: Repository Validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate repository
        run: python scripts/validate_repo.py

      - name: Test CI helper scripts
        run: python -m unittest discover -s scripts/tests -p "test_*.py"

  detect-changed-plugins:
    name: Detect Changed Plugins
    needs: repository-validation
    runs-on: ubuntu-latest
    outputs:
      plugins: ${{ steps.detect.outputs.plugins }}
      matrix: ${{ steps.detect.outputs.matrix }}
      has_changes: ${{ steps.detect.outputs.has_changes }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Detect changed plugin modules
        id: detect
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: >-
          python scripts/detect_changed_plugins.py
          --base "$BASE_SHA"
          --head "$HEAD_SHA"
          --github-output "$GITHUB_OUTPUT"

  plugin-tests:
    name: Plugin Tests (${{ matrix.label }})
    needs: detect-changed-plugins
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-changed-plugins.outputs.matrix) }}
    steps:
      - name: No changed plugin modules
        if: ${{ matrix.run_tests == false }}
        run: echo "No changed plugin modules found; Plugin Tests pass."

      - name: Check out repository
        if: ${{ matrix.run_tests }}
        uses: actions/checkout@v4

      - name: Set up Go
        if: ${{ matrix.run_tests }}
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.2'
          cache: false

      - name: Tidy, vet, and test plugin module
        if: ${{ matrix.run_tests }}
        working-directory: ${{ matrix.plugin }}
        env:
          GOWORK: 'off'
        run: |
          go mod tidy -diff
          go vet ./...
          go test -race ./...

  ci-gate:
    name: CI Gate
    if: ${{ always() }}
    needs:
      - repository-validation
      - detect-changed-plugins
      - plugin-tests
    runs-on: ubuntu-latest
    steps:
      - name: Fail when a required CI job did not pass
        if: ${{ needs.repository-validation.result != 'success' || needs.detect-changed-plugins.result != 'success' || needs.plugin-tests.result != 'success' }}
        run: exit 1

      - name: CI Gate passed
        run: echo "Repository Validation, changed plugin detection, and Plugin Tests passed."
